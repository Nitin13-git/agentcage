[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcage"
version = "0.1.0"
description = "Least-privilege sandboxing for agent sessions — scope-enforced file, subprocess, and network access."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nitin Kushwaha" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentcage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
